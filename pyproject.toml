[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rt-superconductor"
version = "0.1.0"
description = "Evidence and candidate-ranking tools for superconducting-material research"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "RT-SuperConductor contributors"}]
dependencies = []

[project.optional-dependencies]
ml = [
    "joblib>=1.3",
    "matminer>=0.9",
    "numpy>=1.24",
    "pandas>=2.0",
    "pymatgen>=2024.1",
    "scikit-learn>=1.4",
]
mp = ["mp-api>=0.45"]

[project.scripts]
rt-superconductor-pipeline = "rt_superconductor.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
