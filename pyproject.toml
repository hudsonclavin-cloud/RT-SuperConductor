[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rt-superconductor"
version = "0.1.0"
description = "Evidence and candidate-ranking tools for superconducting-material research"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "RT-SuperConductor contributors"}]
dependencies = []

[project.optional-dependencies]
ml = ["joblib>=1.3", "numpy>=1.24", "scikit-learn>=1.4"]

[project.scripts]
rt-superconductor-pipeline = "rt_superconductor.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
