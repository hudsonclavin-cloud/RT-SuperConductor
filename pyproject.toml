[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rt-superconductor"
version = "0.1.0"
description = "Evidence and candidate-ranking tools for superconducting-material research"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "RT-SuperConductor contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
ml = [
    "joblib>=1.3",
    "matminer>=0.9",
    "numpy>=1.24",
    "pandas>=2.0",
    "pymatgen>=2024.1",
    "scikit-learn>=1.7",
]
mp = ["mp-api>=0.45,<0.46", "emmet-core>=0.84.3,<0.87"]
graph = [
    "alignn==2026.11.1",
    "dgl==2.1.0",
    "numpy<2",
    "pyarrow<20",
    "torch==2.2.1",
    "torchdata==0.7.1",
]

physical = ["chgnet==0.4.2", "phonopy==4.8.6", "numpy<2", "scipy<1.17"]

[project.scripts]
rt-superconductor-pipeline = "rt_superconductor.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
