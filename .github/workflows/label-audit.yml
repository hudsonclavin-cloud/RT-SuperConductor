name: Label audit

# Scans the training table for probable duplicates and labels that look wrong, and brings them to the owner's
# attention (docs/label-audit.md). It changes no label: every flag is a lead for the owner's correction rule.
# Locked rows are never read, and the run refuses a rebuilt table whose checksum differs from
# docs/scratchnet-data.json, because the locked rows would then not be the real ones.

on:
  schedule:
    - cron: "23 4 * * 1"          # Mondays 04:23 UTC
  workflow_dispatch:
  push:
    paths:
      - "data/training/**"
      - "scripts/label_audit.py"
      - ".github/workflows/label-audit.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: label-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache pinned raw datasets
        uses: actions/cache@v4
        with:
          path: data/raw
          key: rt-supercon-raw-v2-${{ hashFiles('data/manifest.json', 'data/training/physics-target-source.json', 'scripts/download_training_data.py') }}-supercon2-ed55ea8f43a0984d77b5c29576164e06
      - name: Install dependencies
        run: python -m pip install --upgrade pip '.[ml]'
      - name: Download the pinned sources
        run: python scripts/download_training_data.py --cif-limit 0
      - name: Rebuild the training table
        # The rebuild's own report goes to a scratch file, so the audit checks against the committed checksum.
        run: python scripts/build_scratchnet_data.py --skip-elements --report "$RUNNER_TEMP/rebuild-report.json"
      - name: Audit the labels
        run: python scripts/label_audit.py --out label-audit --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the full report
        uses: actions/upload-artifact@v5
        with:
          name: label-audit
          path: label-audit/
          retention-days: 30
      - name: Open or update the label-audit issue
        if: github.event_name != 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Label audit: leads to check';
            let body = fs.readFileSync('label-audit/label-audit.md', 'utf8');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            body += `\nFull lists (CSV and JSON): the \`label-audit\` artifact of [this run](${run}).\n\n---\n_Generated by the label-audit workflow (scripts/label_audit.py)._\n`;
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n(truncated; see the artifact)\n';
            const open = await github.paginate(github.rest.issues.listForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = open.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                                                issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
