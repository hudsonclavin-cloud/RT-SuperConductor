name: Continuous AI training

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      deep_mp_reference_run:
        description: "Optional successful physical-study run ID to reuse its MP properties"
        required: false
        default: ""
        type: string
      deep_mp_ids:
        description: "Optional comma-separated MP/MVC reference IDs (empty selects all)"
        required: false
        default: ""
        type: string
      deep_ablation:
        description: "Run the paired physics-feature ablation on all 3DSC CIFs"
        required: false
        default: false
        type: boolean
      deep_mp_enrichment:
        description: "Fetch reference DOS, orbital fractions, and bulk moduli using the repository secret"
        required: false
        default: false
        type: boolean
      deep_mp_limit:
        description: "Reference MP IDs to query (100 for smoke check; 0 for all)"
        required: false
        default: 100
        type: number
      family:
        description: "Optional chemical family for a within-family shortlist (for example Ferrites)"
        required: false
        default: ""
        type: string
      build_untested_pool:
        description: "Query Materials Project and save a raw query snapshot artifact; optionally replay a prior snapshot offline"
        required: false
        default: false
        type: boolean
      mp_snapshot_run_id:
        description: "Optional prior continuous-training run ID containing an untested-pool MP snapshot for offline replay"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - "scripts/train_baseline.py"
      - "scripts/train_pressure_aware.py"
      - "scripts/build_label_audit_queue.py"
      - "scripts/build_supercon2_review_queue.py"
      - "scripts/build_supermat_review_queue.py"
      - "scripts/build_review_campaign.py"
      - "scripts/run_three_generation_campaign.py"
      - "scripts/run_active_learning.py"
      - "scripts/build_untested_pool.py"
      - "scripts/untested_pool_policy.py"
      - "scripts/chemistry_policy.py"
      - "scripts/download_training_data.py"
      - "scripts/ingest_3dsc.py"
      - "scripts/rank_candidates.py"
      - "scripts/promotion_gate.py"
      - "scripts/generate_qe_inputs.py"
      - "scripts/prepare_ferrite_dft.py"
      - "scripts/validate_ferrite_shortlist.py"
      - "scripts/run_ferrite_shortlist.py"
      - "scripts/evaluate_structure_features.py"
      - "scripts/compute_formula_descriptors.py"
      - "scripts/bridge_reviewed_records.py"
      - "scripts/validate_harmonized.py"
      - "scripts/validate_reviewed_training.py"
      - "src/rt_superconductor/**"
      - "pyproject.toml"
      - "data/training/**"
      - "data/results/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: continuous-training-${{ github.ref }}-${{ (inputs.deep_ablation || inputs.deep_mp_enrichment || inputs.deep_mp_reference_run) && 'physical-study' || 'regular' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  train:
    if: >-
      ${{ !inputs.deep_ablation && !inputs.deep_mp_enrichment && !inputs.deep_mp_reference_run &&
          !inputs.build_untested_pool && inputs.mp_snapshot_run_id == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache pinned raw datasets
        uses: actions/cache@v4
        with:
          path: data/raw
          key: rt-supercon-raw-v2-${{ hashFiles('data/manifest.json', 'data/training/physics-target-source.json', 'scripts/download_training_data.py') }}-supercon2-ed55ea8f43a0984d77b5c29576164e06
      - name: Install machine-learning dependencies
        run: python -m pip install --upgrade pip '.[ml,mp]'
      - name: Validate reviewed records
        run: |
          mkdir -p data/processed/continuous-training
          python scripts/validate_reviewed_training.py \
            --input-dir data/training/reviewed \
            --report data/processed/continuous-training/reviewed-training-report.json
      - name: Bridge reviewed records and validate harmonized schema
        run: |
          python scripts/bridge_reviewed_records.py \
            --harmonized data/training/harmonized_supercon.csv \
            --reviewed data/training/reviewed/reviewed_records.csv
          python scripts/validate_harmonized.py \
            --input data/training/harmonized_supercon.csv \
            --report data/processed/continuous-training/harmonized-report.json
      - name: Refresh SuperCon2 and SuperMat literature review queues
        run: |
          mkdir -p data/raw/supercon2 data/raw/supermat data/processed/continuous-training/evidence-intake
          if [ ! -f data/raw/supercon2/supercon2_v22.12.03.csv ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              --output data/raw/supercon2/supercon2_v22.12.03.csv \
              "https://mdr.nims.go.jp/filesets/b737b44a-b07a-4853-9378-8ba63f644e79/download"
          fi
          echo "ed55ea8f43a0984d77b5c29576164e06  data/raw/supercon2/supercon2_v22.12.03.csv" | md5sum --check
          if [ ! -f data/raw/supermat/SuperMat-2.0.csv ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              --output data/raw/supermat/SuperMat-2.0.csv \
              "https://raw.githubusercontent.com/lfoppiano/SuperMat/master/data/csv/SuperMat-2.0.csv"
          fi
          echo "80e84ab67649a562a838c5a58fa8bb8025fe1e3225ad2eb664d9bcf3be8ed3ce  data/raw/supermat/SuperMat-2.0.csv" \
            | sha256sum --check
          echo "source_file_sha256=80e84ab67649a562a838c5a58fa8bb8025fe1e3225ad2eb664d9bcf3be8ed3ce" \
            > data/processed/continuous-training/evidence-intake/supermat-source-revision.txt
          python scripts/build_supercon2_review_queue.py \
            --input data/raw/supercon2/supercon2_v22.12.03.csv \
            --output data/processed/continuous-training/evidence-intake/supercon2-review-queue.csv \
            --limit 1000
          python scripts/build_supermat_review_queue.py \
            --input data/raw/supermat/SuperMat-2.0.csv \
            --output data/processed/continuous-training/evidence-intake/supermat-review-queue.csv \
            --manifest data/processed/continuous-training/evidence-intake/supermat-intake-manifest.json
          python scripts/build_review_campaign.py \
            --input data/processed/continuous-training/evidence-intake/supercon2-review-queue.csv \
            --output data/processed/continuous-training/evidence-intake/paper-review-campaign.json \
            --batch-size 10
          sha256sum data/raw/supercon2/supercon2_v22.12.03.csv data/raw/supermat/SuperMat-2.0.csv \
            > data/processed/continuous-training/evidence-intake/source-checksums.txt
      - name: Run one reproducible active-learning cycle
        env:
          MP_API_KEY: ${{ secrets.Materials_Project_API }}
          UCI_ARCHIVE_SHA256: 87f4490d73390ff94ee01dbf0d7d32abc80b22f2c803d471765cfc46a9f6371e
          THREEDSC_TABLE_SHA256: 353b86f9c60505d11a3e25df8312da02ff88fd8e27af05b632dec4739d52eb24
        run: |
          python scripts/run_active_learning.py \
            --data-root data/raw \
            --harmonized data/training/harmonized_supercon.csv \
            --output-dir data/processed/continuous-training \
            --all-cifs \
            --batch-size 25
      - name: Compute formula shell and bonding descriptors
        run: |
          python scripts/compute_formula_descriptors.py \
            --input data/training/harmonized_supercon.csv \
            --output data/processed/continuous-training/formula-descriptors.csv
      - name: Run requested within-family shortlist
        if: ${{ inputs.family != '' }}
        env:
          MP_API_KEY: ${{ secrets.Materials_Project_API }}
          REQUESTED_FAMILY: ${{ inputs.family }}
        run: |
          family_slug="$(printf '%s' "$REQUESTED_FAMILY" | tr '[:upper:] ' '[:lower:]_')"
          mkdir -p "data/processed/continuous-training/family-${family_slug}"
          python scripts/run_ferrite_shortlist.py \
            --family "$REQUESTED_FAMILY" \
            --data-root data/raw \
            --output-root "data/processed/continuous-training/family-${family_slug}" \
            --candidates "data/processed/continuous-training/family-${family_slug}/${family_slug}_top25.csv" \
            --supercon2 data/raw/supercon2/supercon2_v22.12.03.csv \
            --supermat data/raw/supermat/SuperMat-2.0.csv \
            --skip-download
      - name: Upload requested family shortlist
        if: ${{ inputs.family != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: family-shortlist-${{ github.run_id }}
          path: data/processed/continuous-training/family-*/
          if-no-files-found: error
      - name: Publish run summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(Path("data/processed/continuous-training/active-learning-run.json").read_text())
          baseline = run["baseline"]
          pressure = run["pressure_aware"]
          ranking = run["candidate_ranking"]
          spin_eval = run["structure_spin_ablation"]
          evidence = Path("data/processed/continuous-training/evidence-intake")
          supercon2_rows = sum(1 for _ in (evidence / "supercon2-review-queue.csv").open(encoding="utf-8")) - 1
          supermat = json.loads((evidence / "supermat-intake-manifest.json").read_text())
          campaign = json.loads((evidence / "paper-review-campaign.json").read_text())
          summary = (
              f"### Continuous training\n"
              f"- Run status: {run['status']}\n"
              f"- Review leads: SuperCon2 {supercon2_rows}; SuperMat {supermat['candidate_rows']} (not training labels)\n"
              f"- Paper-review tasks prepared: {campaign['stages'][2]['task_count']}\n"
              f"- UCI baseline: {baseline.get('rows', 'blocked')} rows\n"
              f"- 3DSC empirical training rows: {pressure.get('empirical_training_record_count', 'blocked')}\n"
              f"- Family-held-out pressure model: {pressure.get('training_status', 'blocked')}\n"
              f"- 3DSC structure/spin ablation: {spin_eval.get('evaluation', {}).get('status', spin_eval.get('status', 'blocked'))}; "
              f"{spin_eval.get('coverage', {}).get('feature_rows', 0)} CIF-backed feature rows\n"
              f"- Ranked candidates: {ranking.get('ranked_count', 0)}\n"
              f"- Candidate artifact: `data/processed/candidates/top_k.csv`\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          PY
      - name: Upload models, metrics, evidence queues, and shortlist
        uses: actions/upload-artifact@v5
        with:
          name: continuous-training-${{ github.run_id }}
          path: |
            data/processed/continuous-training/
            data/processed/candidates/

  deep_physics:
    if: ${{ inputs.deep_ablation || inputs.deep_mp_enrichment || inputs.deep_mp_reference_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache pinned raw datasets
        uses: actions/cache@v4
        with:
          path: data/raw
          key: rt-supercon-raw-v2-${{ hashFiles('data/manifest.json', 'data/training/physics-target-source.json', 'scripts/download_training_data.py') }}-supercon2-ed55ea8f43a0984d77b5c29576164e06
      - name: Cache CIF feature calculations
        if: ${{ inputs.deep_ablation }}
        uses: actions/cache@v4
        with:
          path: data/processed/cif-feature-cache
          key: rt-supercon-features-v2-${{ hashFiles('data/manifest.json', 'data/training/physics-target-source.json', 'scripts/download_training_data.py', 'scripts/ingest_3dsc.py', 'scripts/deep_physics_features.py') }}-supercon2-ed55ea8f43a0984d77b5c29576164e06
      - name: Install ablation and MP dependencies
        run: python -m pip install '.[ml,mp]'
      - name: Download pinned sources and requested CIF coverage
        env:
          RUN_ABLATION: ${{ inputs.deep_ablation }}
        run: |
          if [ "$RUN_ABLATION" = "true" ]; then
            python scripts/download_training_data.py --all-cifs
          else
            python scripts/download_training_data.py --cif-limit 0
          fi
          python scripts/ingest_3dsc.py --features data/processed/structure_features.csv
      - name: Build cached physical and oxide/correlation features
        if: ${{ inputs.deep_ablation }}
        run: |
          python scripts/deep_physics_features.py --workers 2
          python scripts/deep_physics_checks.py geometry \
            --output data/processed/structure_features_checks.csv
      - name: Download an existing reference-property table
        if: ${{ inputs.deep_mp_reference_run }}
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.deep_mp_reference_run }}
          name: physical-study-${{ inputs.deep_mp_reference_run }}
          path: data/processed/reference-enrichment
      - name: Merge reference properties with current geometry
        if: ${{ inputs.deep_mp_reference_run }}
        run: |
          feature_table=data/processed/structure_features.csv
          if [ -f data/processed/structure_features_checks.csv ]; then
            feature_table=data/processed/structure_features_checks.csv
          fi
          python scripts/merge_physics_enrichment.py --base "$feature_table" \
            --enrichment data/processed/reference-enrichment/structure_features_mp.csv \
            --output data/processed/structure_features_mp.csv
      - name: Retain reference-property collection provenance
        if: ${{ inputs.deep_mp_reference_run }}
        env:
          REFERENCE_RUN_ID: ${{ inputs.deep_mp_reference_run }}
        run: |
          python - <<'PYREF'
          import json, os
          from pathlib import Path
          source=Path('data/processed/reference-enrichment/structure_features_mp.json')
          metadata=json.loads(source.read_text())
          metadata['reused_from_run_id']=os.environ['REFERENCE_RUN_ID']
          metadata['reuse_note']='Reference properties reused with record/MP identity validation; geometry coverage comes from the current feature table'
          metadata['queries_this_run']=0
          metadata.setdefault('reuse_run_chain',[]).append(os.environ['REFERENCE_RUN_ID'])
          Path('data/processed/structure_features_reference_source.json').write_text(json.dumps(metadata,indent=2))
          Path('data/processed/structure_features_mp.json').write_text(json.dumps(metadata,indent=2))
          PYREF
      - name: Enrich reference structures with elasticity and projected DOS
        if: ${{ inputs.deep_mp_enrichment && !inputs.deep_mp_reference_run }}
        env:
          MP_API_KEY: ${{ secrets.Materials_Project_API }}
          DEEP_MP_LIMIT: ${{ inputs.deep_mp_limit }}
          DEEP_MP_IDS: ${{ inputs.deep_mp_ids }}
        run: |
          feature_table=data/processed/structure_features.csv
          if [ -f data/processed/structure_features_checks.csv ]; then
            feature_table=data/processed/structure_features_checks.csv
          fi
          python scripts/enrich_deep_mp.py --features "$feature_table" \
            --limit "$DEEP_MP_LIMIT" --ids "$DEEP_MP_IDS" --output data/processed/structure_features_mp.csv
      - name: Run paired group-held-out ablation
        if: ${{ inputs.deep_ablation }}
        run: |
          feature_table=data/processed/structure_features_checks.csv
          if [ -f data/processed/structure_features_mp.csv ]; then
            feature_table=data/processed/structure_features_mp.csv
          fi
          python scripts/deep_ablation.py --features "$feature_table"
      - name: Index physical-study artifacts
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          root=Path('data/processed');root.mkdir(parents=True,exist_ok=True)
          files=sorted(set(root.glob('structure_features*.csv')) | set(root.glob('structure_features*.json')) | set(root.glob('deep-ablation/*.json')) | set(root.glob('deep-ablation/*.csv')))
          index=root/'ARTIFACT-INDEX.txt';index.write_text('Paths relative to the downloaded artifact root:\n'+'\n'.join(str(p.relative_to(root)) for p in files)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Physical-study tables: '+str(len(files))+' files; see ARTIFACT-INDEX.txt in the artifact. Missing or blocked properties retain explicit statuses.\n')
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: physical-study-${{ github.run_id }}
          if-no-files-found: error
          path: |
            data/processed/ARTIFACT-INDEX.txt
            data/processed/structure_features*.csv
            data/processed/structure_features*.json
            data/processed/deep-ablation/*.json
            data/processed/deep-ablation/*.csv
  untested-pool-v2:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && (inputs.build_untested_pool || inputs.mp_snapshot_run_id != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache pinned raw datasets
        uses: actions/cache@v4
        with:
          path: data/raw
          key: rt-supercon-raw-v2-${{ hashFiles('data/manifest.json', 'data/training/physics-target-source.json', 'scripts/download_training_data.py') }}-supercon2-ed55ea8f43a0984d77b5c29576164e06
      - name: Install modeling and Materials Project dependencies
        run: python -m pip install --upgrade pip '.[ml,mp]'
      - name: Download pinned source data and prior shortlist
        run: |
          mkdir -p data/processed/continuous-training data/raw/supercon2 data/raw/supermat
          python scripts/download_training_data.py \
            --data-root data/raw \
            --cif-limit 0 \
            --report data/processed/continuous-training/source-download-report.json
          if [ ! -f data/raw/supercon2/supercon2_v22.12.03.csv ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              --output data/raw/supercon2/supercon2_v22.12.03.csv \
              "https://mdr.nims.go.jp/filesets/b737b44a-b07a-4853-9378-8ba63f644e79/download"
          fi
          echo "ed55ea8f43a0984d77b5c29576164e06  data/raw/supercon2/supercon2_v22.12.03.csv" | md5sum --check
          if [ ! -f data/raw/supermat/SuperMat-2.0.csv ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              --output data/raw/supermat/SuperMat-2.0.csv \
              "https://raw.githubusercontent.com/lfoppiano/SuperMat/master/data/csv/SuperMat-2.0.csv"
          fi
          echo "80e84ab67649a562a838c5a58fa8bb8025fe1e3225ad2eb664d9bcf3be8ed3ce  data/raw/supermat/SuperMat-2.0.csv" \
            | sha256sum --check
          if [ -f docs/untested-pool-shortlist.csv ]; then
            cp docs/untested-pool-shortlist.csv /tmp/untested-pool-v1.csv
          else
            printf 'rank_within_family,mp_id,formula\n' > /tmp/untested-pool-v1.csv
          fi
      - name: Restore prior raw Materials Project query snapshot
        if: ${{ inputs.mp_snapshot_run_id != '' }}
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.mp_snapshot_run_id }}
          name: untested-pool-v2-${{ inputs.mp_snapshot_run_id }}
          path: data/processed/continuous-training
      - name: Prepare training table and main within-family report
        run: |
          python scripts/ingest_3dsc.py \
            --input data/raw/3dsc/MP/3DSC_MP.csv \
            --output data/training/harmonized_supercon.csv \
            --structure-root data/raw/3dsc/MP/cifs \
            --report data/processed/continuous-training/3dsc-ingestion-report.json \
            --structure-index data/processed/continuous-training/3dsc-structure-index.csv
          python scripts/build_label_audit_queue.py \
            --input data/training/harmonized_supercon.csv \
            --output data/training/label_audit_queue.csv
          python scripts/validate_harmonized.py \
            --input data/training/harmonized_supercon.csv \
            --report data/processed/continuous-training/harmonized-report.json
          python scripts/train_pressure_aware.py \
            --input data/training/harmonized_supercon.csv \
            --output-dir data/processed/continuous-training/pressure-aware
      - name: Build v2 pool using provisional summary metallicity and optional DOS
        env:
          MP_API_KEY: ${{ secrets.Materials_Project_API }}
        run: |
          python scripts/build_untested_pool.py \
            --input data/training/harmonized_supercon.csv \
            --model-dir data/processed/continuous-training/pressure-aware \
            --output data/processed/continuous-training/untested-pool-shortlist.csv \
            --report data/processed/continuous-training/untested-pool-report.json \
            --summary data/processed/continuous-training/untested-pool-summary.md \
            --epw-shortlist data/processed/continuous-training/epw-eligible-shortlist.csv \
            --epw-audit data/processed/continuous-training/epw-eligibility-audit.csv \
            --old-shortlist /tmp/untested-pool-v1.csv \
            --mp-cache data/processed/continuous-training/mp-query-cache.json.gz \
            --3dsc data/raw/3dsc/MP/3DSC_MP.csv \
            --uci data/raw/uci/extracted/unique_m.csv \
            --stanev data/raw/3dsc/Supercon_data_by_2018_Stanev.csv \
            --supercon2 data/raw/supercon2/supercon2_v22.12.03.csv \
            --supermat data/raw/supermat/SuperMat-2.0.csv \
            --top-per-family 30
      - name: Publish screening counts
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path("data/processed/continuous-training/untested-pool-report.json").read_text())
          snapshot = report.get("dos_fetch_diagnostics", {}).get("mp_query_cache", {})
          rows = [
              "### Existing-but-untested Materials Project pool v2",
              f"- Summary-metallicity-qualified pool: {report['pool_size_after_summary_metallicity']}",
              f"- MP summary is_metal=true / band_gap=0 counts: {report['filter_counts'].get('mp_summary_is_metal_true', 0)} / {report['filter_counts'].get('mp_summary_band_gap_zero', 0)}; accepted union: {report['filter_counts'].get('mp_summary_metallicity_accepted', 0)}",
              f"- Optional DOS(E_F) curves: {report['filter_counts'].get('dos_curves_retrieved', 0)} retrieved; {report['filter_counts'].get('dos_ef_gt_0p1_optional_enrichment', 0)} above 0.1 states/eV/atom",
              f"- Family-assigned: {report['pool_size_assigned_to_families']}",
              f"- Scored: {report['pool_size_scored_after_family_gate']}",
              f"- Top-30 shortlist rows: {report['shortlist_rows']}",
              f"- EPW-eligible Other-family non-magnetic rows: {report.get('epw_eligible_rows', 0)}",
              f"- EPW exclusions by reason: `{json.dumps(report.get('epw_eligibility_counts', {}), sort_keys=True)}`",
              f"- Active label-audit training exclusions: {report.get('label_quarantine', {}).get('excluded_training_rows', 0)}",
              f"- FeCuO2 prior-shortlist outcome: {report.get('fecu_o2_old_shortlist_outcome', {}).get('disposition', 'not reported')} / {report.get('fecu_o2_old_shortlist_outcome', {}).get('reason', 'no reason')}",
              f"- Prior shortlist retained/removed: {report['old_shortlist_retained']}/{report['old_shortlist_removed']}",
              f"- Raw Materials Project query snapshot: `{snapshot.get('mode', 'missing')}`; SHA-256 `{snapshot.get('sha256', 'missing')}`; included in the run artifact.",
              "- Filter counts: `" + json.dumps(report["filter_counts"], sort_keys=True) + "`",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(rows) + "\n")
          PY
      - name: Publish requested docs outputs
        run: |
          cp data/processed/continuous-training/untested-pool-shortlist.csv docs/untested-pool-shortlist.csv
          cp data/processed/continuous-training/epw-eligible-shortlist.csv docs/epw-eligible-shortlist.csv
          cp data/processed/continuous-training/untested-pool-summary.md /tmp/untested-pool-summary-current.md
          {
            cat /tmp/untested-pool-summary-current.md
            printf '\n\n## Archived report before the provisional summary-metallicity gate\n\n'
            printf 'The following report is retained unchanged for historical comparison. Its empty result reflected the former mandatory DOS-curve gate; the current run above supersedes that screening logic.\n\n'
            cat docs/untested-pool-summary-history.md
          } > docs/untested-pool-summary.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/untested-pool-shortlist.csv docs/epw-eligible-shortlist.csv docs/untested-pool-summary.md docs/untested-pool-summary-history.md data/training/label_audit_queue.csv
          if ! git diff --cached --quiet; then
            git commit -m "data: publish v2 untested materials shortlist"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload v2 shortlist and audit report
        uses: actions/upload-artifact@v5
        with:
          name: untested-pool-v2-${{ github.run_id }}
          path: data/processed/continuous-training/
          if-no-files-found: error
