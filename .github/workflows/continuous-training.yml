name: Continuous AI training

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      family:
        description: "Optional chemical family for a within-family shortlist (for example Ferrites)"
        required: false
        default: ""
        type: string
      build_untested_pool:
        description: "Query MP for ordered stable metals absent from the five local superconductivity exports"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - "scripts/train_baseline.py"
      - "scripts/train_pressure_aware.py"
      - "scripts/build_supercon2_review_queue.py"
      - "scripts/build_supermat_review_queue.py"
      - "scripts/build_review_campaign.py"
      - "scripts/run_three_generation_campaign.py"
      - "scripts/run_active_learning.py"
      - "scripts/build_untested_pool.py"
      - "scripts/download_training_data.py"
      - "scripts/ingest_3dsc.py"
      - "scripts/rank_candidates.py"
      - "scripts/promotion_gate.py"
      - "scripts/generate_qe_inputs.py"
      - "scripts/prepare_ferrite_dft.py"
      - "scripts/validate_ferrite_shortlist.py"
      - "scripts/run_ferrite_shortlist.py"
      - "scripts/evaluate_structure_features.py"
      - "scripts/compute_formula_descriptors.py"
      - "scripts/bridge_reviewed_records.py"
      - "scripts/validate_harmonized.py"
      - "scripts/validate_reviewed_training.py"
      - "src/rt_superconductor/**"
      - "pyproject.toml"
      - "data/training/**"
      - "data/results/**"
      - "docs/continuous-training.md"
      - "docs/faculty_research_summary.md"

permissions:
  contents: write

concurrency:
  group: continuous-training
  cancel-in-progress: false

jobs:
  train:
    if: >-
      ${{ !((github.event_name == 'workflow_dispatch' && inputs.build_untested_pool) ||
            (github.event_name == 'push' && contains(toJSON(github.event.commits), 'scripts/build_untested_pool.py'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install machine-learning dependencies
        run: python -m pip install --upgrade pip '.[ml,mp]'
      - name: Validate reviewed records
        run: |
          mkdir -p data/processed/continuous-training
          python scripts/validate_reviewed_training.py \
            --input-dir data/training/reviewed \
            --report data/processed/continuous-training/reviewed-training-report.json
      - name: Bridge reviewed records and validate harmonized schema
        run: |
          python scripts/bridge_reviewed_records.py \
            --harmonized data/training/harmonized_supercon.csv \
            --reviewed data/training/reviewed/reviewed_records.csv
          python scripts/validate_harmonized.py \
            --input data/training/harmonized_supercon.csv \
            --report data/processed/continuous-training/harmonized-report.json
      - name: Refresh SuperCon2 and SuperMat literature review queues
        run: |
          mkdir -p /tmp/supermat data/processed/continuous-training/evidence-intake
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/supercon2.csv \
            "https://mdr.nims.go.jp/filesets/b737b44a-b07a-4853-9378-8ba63f644e79/download"
          echo "ed55ea8f43a0984d77b5c29576164e06  /tmp/supercon2.csv" | md5sum --check
          git clone --depth 1 https://github.com/lfoppiano/SuperMat.git /tmp/supermat/repo
          cp /tmp/supermat/repo/data/csv/SuperMat-2.0.csv /tmp/supermat/SuperMat-2.0.csv
          git -C /tmp/supermat/repo rev-parse HEAD > data/processed/continuous-training/evidence-intake/supermat-source-revision.txt
          python scripts/build_supercon2_review_queue.py \
            --input /tmp/supercon2.csv \
            --output data/processed/continuous-training/evidence-intake/supercon2-review-queue.csv \
            --limit 1000
          python scripts/build_supermat_review_queue.py \
            --input /tmp/supermat/SuperMat-2.0.csv \
            --output data/processed/continuous-training/evidence-intake/supermat-review-queue.csv \
            --manifest data/processed/continuous-training/evidence-intake/supermat-intake-manifest.json
          python scripts/build_review_campaign.py \
            --input data/processed/continuous-training/evidence-intake/supercon2-review-queue.csv \
            --output data/processed/continuous-training/evidence-intake/paper-review-campaign.json \
            --batch-size 10
          sha256sum /tmp/supercon2.csv /tmp/supermat/SuperMat-2.0.csv \
            > data/processed/continuous-training/evidence-intake/source-checksums.txt
      - name: Run one reproducible active-learning cycle
        env:
          MP_API_KEY: ${{ secrets.Materials_Project_API }}
          UCI_ARCHIVE_SHA256: 87f4490d73390ff94ee01dbf0d7d32abc80b22f2c803d471765cfc46a9f6371e
          THREEDSC_TABLE_SHA256: 353b86f9c60505d11a3e25df8312da02ff88fd8e27af05b632dec4739d52eb24
        run: |
          python scripts/run_active_learning.py \
            --data-root data/raw \
            --harmonized data/training/harmonized_supercon.csv \
            --output-dir data/processed/continuous-training \
            --cif-limit 96 \
            --batch-size 25
      - name: Compute formula shell and bonding descriptors
        run: |
          python scripts/compute_formula_descriptors.py \
            --input data/training/harmonized_supercon.csv \
            --output data/processed/continuous-training/formula-descriptors.csv
      - name: Build and score existing-but-untested Materials Project pool
        if: >-
          ${{ (github.event_name == 'workflow_dispatch' && inputs.build_untested_pool) ||
              (github.event_name == 'push' && contains(toJSON(github.event.commits), 'scripts/build_untested_pool.py')) }}
        env:
          MP_API_KEY: ${{ secrets.Materials_Project_API }}
        run: |
          python scripts/build_untested_pool.py \
            --input data/training/harmonized_supercon.csv \
            --model-dir data/processed/continuous-training/pressure-aware \
            --output data/processed/continuous-training/untested-pool-shortlist.csv \
            --report data/processed/continuous-training/untested-pool-report.json \
            --3dsc data/raw/3dsc/MP/3DSC_MP.csv \
            --uci data/raw/uci/extracted/unique_m.csv \
            --stanev data/raw/3dsc/Supercon_data_by_2018_Stanev.csv \
            --supercon2 /tmp/supercon2.csv \
            --supermat /tmp/supermat/SuperMat-2.0.csv \
            --top-per-family 50
      - name: Run requested within-family shortlist
        if: ${{ inputs.family != '' }}
        env:
          MP_API_KEY: ${{ secrets.Materials_Project_API }}
          REQUESTED_FAMILY: ${{ inputs.family }}
        run: |
          family_slug="$(printf '%s' "$REQUESTED_FAMILY" | tr '[:upper:] ' '[:lower:]_')"
          mkdir -p "data/processed/continuous-training/family-${family_slug}"
          python scripts/run_ferrite_shortlist.py \
            --family "$REQUESTED_FAMILY" \
            --data-root data/raw \
            --output-root "data/processed/continuous-training/family-${family_slug}" \
            --candidates "data/processed/continuous-training/family-${family_slug}/${family_slug}_top25.csv" \
            --supercon2 /tmp/supercon2.csv \
            --supermat /tmp/supermat/SuperMat-2.0.csv \
            --skip-download
      - name: Upload requested family shortlist
        if: ${{ inputs.family != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: family-shortlist-${{ github.run_id }}
          path: data/processed/continuous-training/family-*/
          if-no-files-found: error
      - name: Publish run summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(Path("data/processed/continuous-training/active-learning-run.json").read_text())
          baseline = run["baseline"]
          pressure = run["pressure_aware"]
          ranking = run["candidate_ranking"]
          evidence = Path("data/processed/continuous-training/evidence-intake")
          supercon2_rows = sum(1 for _ in (evidence / "supercon2-review-queue.csv").open(encoding="utf-8")) - 1
          supermat = json.loads((evidence / "supermat-intake-manifest.json").read_text())
          campaign = json.loads((evidence / "paper-review-campaign.json").read_text())
          pool_path = Path("data/processed/continuous-training/untested-pool-report.json")
          pool_lines = ""
          if pool_path.is_file():
              pool = json.loads(pool_path.read_text())
              counts = pool.get("filter_counts", {})
              pool_lines = (
                  f"- Existing-but-untested MP pool: {pool.get('pool_size_after_all_materials_project_and_database_filters', 0)} entries; "
                  f"{pool.get('pool_size_scored_after_family_gate', 0)} scored; {pool.get('shortlist_rows', 0)} shortlisted\n"
                  f"- Top shortlist chemistry-policy flags: {pool.get('top_shortlist_chemistry_policy_flagged_count', 0)}\n"
                  f"- MP filter counts: {counts}\n"
              )
          summary = (
              f"### Continuous training\n"
              f"- Run status: {run['status']}\n"
              f"- Review leads: SuperCon2 {supercon2_rows}; SuperMat {supermat['candidate_rows']} (not training labels)\n"
              f"- Paper-review tasks prepared: {campaign['stages'][2]['task_count']}\n"
              f"- UCI baseline: {baseline.get('rows', 'blocked')} rows\n"
              f"- 3DSC empirical training rows: {pressure.get('empirical_training_record_count', 'blocked')}\n"
              f"- Family-held-out pressure model: {pressure.get('training_status', 'blocked')}\n"
              f"- Ranked candidates: {ranking.get('ranked_count', 0)}\n"
              f"- Candidate artifact: `data/processed/candidates/top_k.csv`\n"
              f"{pool_lines}"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          PY
      - name: Upload models, metrics, evidence queues, and shortlist
        uses: actions/upload-artifact@v4
        with:
          name: continuous-training-${{ github.run_id }}
          path: |
            data/processed/continuous-training/
            data/processed/candidates/

  untested-pool:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.build_untested_pool) ||
          (github.event_name == 'push' && contains(toJSON(github.event.commits), 'scripts/build_untested_pool.py')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install machine-learning and Materials Project dependencies
        run: python -m pip install --upgrade pip '.[ml,mp]'
      - name: Validate reviewed records and bridge current labels
        run: |
          mkdir -p data/processed/continuous-training
          python scripts/validate_reviewed_training.py \
            --input-dir data/training/reviewed \
            --report data/processed/continuous-training/reviewed-training-report.json
          python scripts/bridge_reviewed_records.py \
            --harmonized data/training/harmonized_supercon.csv \
            --reviewed data/training/reviewed/reviewed_records.csv
      - name: Download the five formula-index sources without CIF bulk
        run: |
          python scripts/download_training_data.py \
            --data-root data/raw \
            --cif-limit 0 \
            --report data/processed/continuous-training/source-download-report.json
          mkdir -p /tmp/supermat data/processed/continuous-training/evidence-intake
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/supercon2.csv \
            "https://mdr.nims.go.jp/filesets/b737b44a-b07a-4853-9378-8ba63f644e79/download"
          echo "ed55ea8f43a0984d77b5c29576164e06  /tmp/supercon2.csv" | md5sum --check
          git clone --depth 1 https://github.com/lfoppiano/SuperMat.git /tmp/supermat/repo
          cp /tmp/supermat/repo/data/csv/SuperMat-2.0.csv /tmp/supermat/SuperMat-2.0.csv
          git -C /tmp/supermat/repo rev-parse HEAD \
            > data/processed/continuous-training/evidence-intake/supermat-source-revision.txt
          sha256sum /tmp/supercon2.csv /tmp/supermat/SuperMat-2.0.csv \
            > data/processed/continuous-training/evidence-intake/source-checksums.txt
      - name: Ingest 3DSC and compute embargoed within-family metrics
        run: |
          python scripts/ingest_3dsc.py \
            --input data/raw/3dsc/MP/3DSC_MP.csv \
            --output data/training/harmonized_supercon.csv \
            --structure-root data/raw/3dsc/MP/cifs \
            --report data/processed/continuous-training/3dsc-ingestion-report.json \
            --structure-index data/processed/continuous-training/3dsc-structure-index.csv
          python scripts/validate_harmonized.py \
            --input data/training/harmonized_supercon.csv \
            --report data/processed/continuous-training/harmonized-report.json
          python scripts/train_pressure_aware.py \
            --input data/training/harmonized_supercon.csv \
            --output-dir data/processed/continuous-training/pressure-aware
      - name: Build and score existing-but-untested Materials Project pool
        env:
          MP_API_KEY: ${{ secrets.Materials_Project_API }}
        run: |
          python scripts/build_untested_pool.py \
            --input data/training/harmonized_supercon.csv \
            --model-dir data/processed/continuous-training/pressure-aware \
            --output data/processed/continuous-training/untested-pool-shortlist.csv \
            --report data/processed/continuous-training/untested-pool-report.json \
            --3dsc data/raw/3dsc/MP/3DSC_MP.csv \
            --uci data/raw/uci/extracted/unique_m.csv \
            --stanev data/raw/3dsc/Supercon_data_by_2018_Stanev.csv \
            --supercon2 /tmp/supercon2.csv \
            --supermat /tmp/supermat/SuperMat-2.0.csv \
            --top-per-family 50
      - name: Publish untested-pool counts
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("data/processed/continuous-training/untested-pool-report.json").read_text())
          lines = [
              "### Existing-but-untested Materials Project pool",
              f"- Qualified pool: {report['pool_size_after_all_materials_project_and_database_filters']}",
              f"- Assigned to families: {report['pool_size_assigned_to_families']}",
              f"- Scored after embargoed family gate: {report['pool_size_scored_after_family_gate']}",
              f"- Shortlist rows: {report['shortlist_rows']}",
              f"- Chemistry-policy flagged shortlist rows: {report['top_shortlist_chemistry_policy_flagged_count']}",
              "- Filter counts: `" + json.dumps(report["filter_counts"], sort_keys=True) + "`",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
      - name: Commit shortlist and filter report to docs
        run: |
          cp data/processed/continuous-training/untested-pool-shortlist.csv docs/untested-pool-shortlist.csv
          cp data/processed/continuous-training/untested-pool-report.json docs/untested-pool-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/untested-pool-shortlist.csv docs/untested-pool-report.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh untested Materials Project shortlist"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload untested-pool shortlist, counts, and model metrics
        uses: actions/upload-artifact@v4
        with:
          name: untested-pool-${{ github.run_id }}
          path: data/processed/continuous-training/
          if-no-files-found: error
