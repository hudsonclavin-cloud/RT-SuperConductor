name: Continuous AI training

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
  push:
    paths:
      - "scripts/train_baseline.py"
      - "scripts/build_supercon2_review_queue.py"
      - "scripts/build_supermat_review_queue.py"
      - "scripts/build_review_campaign.py"
      - "scripts/run_three_generation_campaign.py"
      - "src/rt_superconductor/**"
      - "pyproject.toml"
      - "data/training/**"
      - "docs/continuous-training.md"
      - "docs/faculty_research_summary.md"
      - "data/results/**"

permissions:
  contents: read

concurrency:
  group: continuous-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install machine-learning dependencies
        run: python -m pip install --upgrade pip '.[ml]'
      - name: Validate reviewed training records
        run: |
          mkdir -p data/processed/continuous-training
          python scripts/validate_reviewed_training.py \
            --input-dir data/training/reviewed \
            --report data/processed/continuous-training/reviewed-training-report.json
      - name: Validate harmonized Phase 2 schema
        run: |
          python scripts/bridge_reviewed_records.py \
            --harmonized data/training/harmonized_supercon.csv \
            --reviewed data/training/reviewed/reviewed_records.csv
          python scripts/validate_harmonized.py \
            --input data/training/harmonized_supercon.csv \
            --report data/processed/continuous-training/harmonized-report.json
      - name: Compute formula shell and bonding descriptors
        run: |
          python scripts/compute_formula_descriptors.py \
            --input data/training/harmonized_supercon.csv \
            --output data/processed/continuous-training/formula-descriptors.csv
      - name: Download the pinned UCI training snapshot
        run: |
          mkdir -p /tmp/uci
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/uci/superconductivity-data.zip \
            "https://archive.ics.uci.edu/static/public/464/superconductivty+data.zip"
          echo "87f4490d73390ff94ee01dbf0d7d32abc80b22f2c803d471765cfc46a9f6371e  /tmp/uci/superconductivity-data.zip" \
            | sha256sum --check
          unzip -q /tmp/uci/superconductivity-data.zip -d /tmp/uci/extracted
      - name: Refresh literature review queues from SuperCon2 and SuperMat
        run: |
          mkdir -p /tmp/supermat data/processed/continuous-training/evidence-intake
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/supercon2.csv \
            "https://mdr.nims.go.jp/filesets/b737b44a-b07a-4853-9378-8ba63f644e79/download"
          echo "ed55ea8f43a0984d77b5c29576164e06  /tmp/supercon2.csv" | md5sum --check
          git clone --depth 1 https://github.com/lfoppiano/SuperMat.git /tmp/supermat/repo
          cp /tmp/supermat/repo/data/csv/SuperMat-2.0.csv /tmp/supermat/SuperMat-2.0.csv
          git -C /tmp/supermat/repo rev-parse HEAD > data/processed/continuous-training/evidence-intake/supermat-source-revision.txt
          python scripts/build_supercon2_review_queue.py \
            --input /tmp/supercon2.csv \
            --output data/processed/continuous-training/evidence-intake/supercon2-review-queue.csv \
            --limit 1000
          python scripts/build_supermat_review_queue.py \
            --input /tmp/supermat/SuperMat-2.0.csv \
            --output data/processed/continuous-training/evidence-intake/supermat-review-queue.csv \
            --manifest data/processed/continuous-training/evidence-intake/supermat-intake-manifest.json
          python scripts/build_review_campaign.py \
            --input data/processed/continuous-training/evidence-intake/supercon2-review-queue.csv \
            --output data/processed/continuous-training/evidence-intake/paper-review-campaign.json \
            --batch-size 10
          sha256sum /tmp/supercon2.csv /tmp/supermat/SuperMat-2.0.csv \
            > data/processed/continuous-training/evidence-intake/source-checksums.txt
      - name: Train grouped composition baseline
        run: |
          python scripts/train_baseline.py \
            --input /tmp/uci/extracted/unique_m.csv \
            --output-dir data/processed/continuous-training
      - name: Train pressure-aware family-grouped surrogate
        run: |
          python scripts/train_pressure_aware.py \
            --input data/training/harmonized_supercon.csv \
            --output-dir data/processed/continuous-training/pressure-aware \
            --allow-insufficient-data
      - name: Publish run summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metrics = json.loads(Path("data/processed/continuous-training/baseline-metrics.json").read_text())
          reviewed = json.loads(Path("data/processed/continuous-training/reviewed-training-report.json").read_text())
          supermat = json.loads(Path("data/processed/continuous-training/evidence-intake/supermat-intake-manifest.json").read_text())
          campaign = json.loads(Path("data/processed/continuous-training/evidence-intake/paper-review-campaign.json").read_text())
          supercon2_rows = sum(1 for _ in Path("data/processed/continuous-training/evidence-intake/supercon2-review-queue.csv").open(encoding="utf-8")) - 1
          model = metrics["model_metrics"]
          baseline = metrics["baseline_metrics"]
          summary = (
              f"### Continuous training\n"
              f"- Rows: {metrics['rows']}\n"
              f"- Validated reviewed records: {reviewed['record_count']}\n"
              f"- New paper-review leads: SuperCon2 {supercon2_rows}; SuperMat {supermat['candidate_rows']} (not training labels)\n"
              f"- SuperMat pressure buckets: {supermat['counts']}\n"
              f"- Paper-review tasks prepared: {campaign['stages'][2]['task_count']}\n"
              f"- Model inference: {campaign['model_inference_status']}; learning cycles completed: {campaign['learning_cycles_completed']}\n"
              f"- Grouped test rows: {metrics['test_rows']}\n"
              f"- Model MAE: {model['mae_k']:.3f} K\n"
              f"- Mean baseline MAE: {baseline['mae_k']:.3f} K\n"
              f"- Model R²: {model['r2']:.3f}\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          PY
      - name: Upload model and metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: continuous-training-${{ github.run_id }}
          path: data/processed/continuous-training/
