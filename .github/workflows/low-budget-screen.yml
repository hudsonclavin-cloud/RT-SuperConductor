name: Low-budget materials screen

on:
  workflow_dispatch:
    inputs:
      minimum_tc_k:
        description: "Minimum extracted Tc in kelvin"
        required: false
        default: "70"
      mp_limit:
        description: "Number of formulas to query in Materials Project"
        required: false
        default: "5"

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    env:
      MP_API_KEY: ${{ secrets.Materials_Project_API }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and Materials Project client
        run: python -m pip install --upgrade pip mp-api .
      - name: Download SuperCon2 source export
        run: |
          mkdir -p data/raw/supercon2
          curl --fail --location --retry 3 --retry-delay 2 \
            --output data/raw/supercon2/supercon2_v22.12.03.csv \
            "https://mdr.nims.go.jp/filesets/b737b44a-b07a-4853-9378-8ba63f644e79/download"
          echo "ed55ea8f43a0984d77b5c29576164e06  data/raw/supercon2/supercon2_v22.12.03.csv" \
            | md5sum --check
      - name: Run pressure-aware screen
        env:
          MINIMUM_TC_K: ${{ inputs.minimum_tc_k }}
          MP_LIMIT: ${{ inputs.mp_limit }}
        run: |
          python scripts/low_budget_pipeline.py \
            --minimum-tc-k "$MINIMUM_TC_K" \
            --mp-limit "$MP_LIMIT"
      - name: Publish Materials Project validation summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("data/processed/low-budget-screen/materials_project_audit.json").read_text(encoding="utf-8"))
          summary = (
              "### Materials Project composition audit\n"
              f"- Status: {report.get('status')}\n"
              f"- Queried formulas: {report.get('queried_formula_count', 0)}\n"
              f"- Safe composition matches: {report.get('safe_match_count', 0)}\n"
              f"- Rejected mismatches/unresolved returned formulas: {report.get('rejected_mismatch_count', 0)}\n"
              f"- Skipped ambiguous inputs: {report.get('skipped_ambiguous_formula_count', 0)}\n"
              f"- API errors: {report.get('api_error_count', 0)}\n"
              f"- No-match responses: {report.get('no_match_count', 0)}\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          PY
      - name: Upload screening artifacts
        uses: actions/upload-artifact@v4
        with:
          name: low-budget-screen
          path: data/processed/low-budget-screen/
