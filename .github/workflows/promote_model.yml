name: Promote pressure-aware surrogate

on:
  workflow_dispatch:
  push:
    paths:
      - "data/training/harmonized_supercon.csv"
      - "data/training/reviewed/**"
      - "scripts/train_pressure_aware.py"
      - "scripts/promotion_gate.py"
      - "src/rt_superconductor/harmonized.py"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: promote-pressure-aware-model
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    outputs:
      gate_status: ${{ steps.capture_gate_status.outputs.gate_status }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ML dependencies
        run: python -m pip install --upgrade pip '.[ml]'
      - name: Validate harmonized training schema
        run: |
          python scripts/bridge_reviewed_records.py \
            --harmonized data/training/harmonized_supercon.csv \
            --reviewed data/training/reviewed/reviewed_records.csv
          python scripts/validate_harmonized.py --input data/training/harmonized_supercon.csv
      - name: Train family-grouped surrogate
        run: |
          python scripts/train_pressure_aware.py \
            --input data/training/harmonized_supercon.csv \
            --output-dir data/processed/promotion-candidate \
            --allow-insufficient-data
      - name: Evaluate strict promotion gate
        id: promotion_gate
        continue-on-error: true
        run: |
          python scripts/promotion_gate.py \
            --predictions data/processed/promotion-candidate/promotion_predictions.csv \
            --model data/processed/promotion-candidate/pressure-aware-model.joblib \
            --report data/processed/promotion-candidate/promotion-gate.json
      - name: Capture promotion-gate status
        id: capture_gate_status
        if: always()
        run: |
          if [ "${{ steps.promotion_gate.outcome }}" = "success" ]; then
            echo "gate_status=pass" >> "$GITHUB_OUTPUT"
            echo "### Promotion gate passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "gate_status=fail" >> "$GITHUB_OUTPUT"
            echo "### Promotion gate blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "The model artifact was evaluated and retained, but promotion is skipped until all thresholds pass." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evaluated candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pressure-aware-candidate-${{ github.run_id }}
          path: data/processed/promotion-candidate/

  promote:
    needs: evaluate
    runs-on: ubuntu-latest
    if: needs.evaluate.outputs.gate_status == 'pass'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download the gate-approved artifact
        uses: actions/download-artifact@v4
        with:
          name: pressure-aware-candidate-${{ github.run_id }}
          path: promoted-model
      - name: Mark artifact as promotion eligible
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("promoted-model/promotion-gate.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          if report.get("status") != "pass":
              raise SystemExit("promotion artifact is not gate-approved")
          (Path("promoted-model") / "PROMOTED").write_text(
              "Strict Phase 2/3 promotion gate passed.\n", encoding="utf-8"
          )
          PY
      - name: Upload promoted model artifact
        uses: actions/upload-artifact@v4
        with:
          name: pressure-aware-promoted-${{ github.run_id }}
          path: promoted-model/
